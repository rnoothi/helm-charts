apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nrKubernetesOtel.ingress.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "newrelic.common.labels" . | nindent 4 }}
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /v1/logs
        pathType: Prefix
        backend:
          service:
            name: {{ include "nrKubernetesOtel.service.fullname" . }}
            port:
              number: 4318
      - path: /v1/metrics
        pathType: Prefix
        backend:
          service:
            name: {{ include "nrKubernetesOtel.service.fullname" . }}
            port:
              number: 4318
      - path: /v1/traces
        pathType: Prefix
        backend:
          service:
            name: {{ include "nrKubernetesOtel.service.fullname" . }}
            port:
              number: 4318
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "nrKubernetesOtel.service.fullname" . }}
            port:
              number: 80
